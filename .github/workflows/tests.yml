name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHON_DOTENV_DISABLED: '1'
      GROQ_API_KEY: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      GUARDIAN_LOCAL_FILES_ONLY: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Prepare reports
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"
      - name: Run regression and integration tests
        id: tests
        run: python -m coverage run -m pytest -q --junitxml=test-results/junit.xml
      - name: Combine subprocess coverage
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python -m coverage combine
      - name: Export coverage
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python -m coverage xml -o test-results/coverage.xml
      - name: Enforce minimum coverage
        run: python -m coverage report --fail-under=90
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-python312-test-reports
          path: |
            test-results/junit.xml
            test-results/coverage.xml
          if-no-files-found: warn
          retention-days: 14
